name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 仅需要 contents: write 即可通过 GITHUB_TOKEN 推送到 gh-pages 分支。
# 不再使用 actions/deploy-pages@v4（该 action 在 GitHub 侧会间歇挂起 ~25 分钟，
# 导致部署卡在 in_progress 并最终失败、给用户发失败邮件）。
# 改用 peaceiris/actions-gh-pages 直接 git push 到 gh-pages 分支（纯推送，稳定不挂起）。
# 注意：请在仓库 Settings → Pages → Source 选择 "Deploy from a branch" → gh-pages → /root。
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.3'
          extended: true

      - name: Install dependencies
        run: npm install

      - name: Build feed data
        run: node scripts/build_feed.js

      - name: Build content index (tags + search filters)
        run: python3 scripts/build_content_index.py

      # 评论区已于 2026-08-29 永久移除（先 Gitalk 后 giscus，均已下线）。
      # 不再注入任何第三方评论组件，静态页保持纯净、CSP 已收紧（frame-src 'none'）。

      - name: Inject site widgets (floating TOC + local bookmark)
        run: python3 scripts/apply_site_widgets.py

      # 结构化数据（发现增长）：为缺失 JSON-LD 的静态页注入 schema.org @graph
      # （WebSite + Article），已含的页跳过、绝不覆盖。Hugo 渲染页由 head.html 注入。
      - name: Inject JSON-LD structured data (static pages)
        run: python3 scripts/apply_jsonld.py

      # PWA 离线阅读：为全部静态页注入 SW 注册脚本（travel 加密页跳过）；Hugo 页由 head.html 注册。
      - name: Inject PWA Service Worker registration (static pages)
        run: python3 scripts/apply_pwa.py

      - name: Build RSS feed
        run: python3 scripts/build_rss.py

      # 旅行板块（私人相册）已改为「密文提交进公开仓库」模式：
      # 加密产物位于 travel-dist/（travel.html + img/travel/*.enc），不依赖任何 CI 密钥，
      # 每次 push 都稳定部署，彻底规避此前因密钥缺失导致 travel.html 被删、整页 404 的问题。
      # 更新旅行内容流程：在私有源仓库改完 → 本地用 TRAVEL_KEY 跑 scripts/encrypt_travel.mjs
      # 重新生成 travel-dist/ → 提交公开仓库即上线。

      # changelog 防御性护栏：构建前强制清除 static/changelog.json 与
      # data/changelog.json 中的空 content 记录（自动更新偶发写坏），
      # 确保部署产物（更新日志页）永不含空白条目。即使脏提交进库也会被此处拦截。
      # （2026-08-20 起 guard_changelog.py 同时内联执行板块新闻日期排序自愈。）
      - name: Guard changelog (strip empty records)
        run: python3 scripts/guard_changelog.py

      # 安全/根因防御性护栏（红队加固 2026-08-22 落地，CI 强制不回归）：
      #  - overflow: 禁止 overflow-x:hidden（sticky 失效根因），必须 overflow-x:clip
      #  - theme_scope: 禁止非关键 <style> 块用全局 --bg/--text 等重定义污染全站 chrome
      #  - csp_hygiene: 禁止 umami 死配置/协议相对外链/jsdelivr 过宽等 CSP 卫生回潮
      #  - v_param: ?v 缓存版本必须一致且资源存在（travel-dist/{{ 模板变量已豁免）
      - name: Guard overflow-x (sticky safety)
        run: python3 scripts/guard_overflow.py
      - name: Guard theme scope (no global var leak)
        run: python3 scripts/guard_theme_scope.py
      - name: Guard CSP hygiene
        run: python3 scripts/guard_csp_hygiene.py
      - name: Guard ?v cache-bust consistency
        run: python3 scripts/guard_v_param.py

      # 板块新闻日期排序护栏：所有 *-news.json 的 news 数组按 date 倒序，
      # 根治「板块日期乱序」。部署前强制规范化，即使上游写入乱序也保证线上有序。
      - name: Sort section news by date
        run: python3 scripts/sort_news.py

      # 首页聚合源：聚合各板块最新新闻生成 static/home-feed.json，供「今日更新」渲染。
      # 部署前运行，确保每次上线都基于最新新闻数据。
      - name: Build homepage feed (today's updates + hot picks)
        run: python3 scripts/build_home_feed.py

      - name: Build Hugo
        run: hugo --gc

      # 部署前站点冒烟测试（后端回归闸，无需密钥）：
      # 静态校验 hugo 产出的 public/ 中本地资源引用（img/script/css/字体/link）是否全部可解析，
      # 并确认 public/index.html 已产出。任何本地资源 404 都会导致线上页面渲染断裂，
      # 故发现即构建失败、阻断部署；内链死链仅 WARN 不阻断。
      - name: Smoke test built site (no broken local assets)
        run: python3 scripts/smoke_test.py public

      # 旅行板块部署前防御闸（key-free，无需 TRAVEL_KEY）：
      # 禁止「明文/不完整外壳」被照常部署上线——曾发生陈旧明文 travel.html 被直接发布、
      # 导致私照泄露与 hero 裂图。CI 不能解密校验，故只做无需密钥的明文/完整性检查
      # （data-tl-wrap / 明文 img 引用 / 缺 noindex 或密码门 / 分片目录混入明文 / 无分片）。
      # 任一不过则构建失败、阻断部署。详细逻辑见 scripts/guard_travel_dist.sh。
      - name: Guard travel artifact (encrypted shell, no plaintext)
        run: bash scripts/guard_travel_dist.sh

      - name: Stage committed travel artifact (encrypted, key-free)
        run: |
          if [ -f travel-dist/travel.html ]; then
            cp -f travel-dist/travel.html public/travel.html
            mkdir -p public/img/travel
            cp -Rf travel-dist/img/travel/. public/img/travel/
            echo "[travel] 已部署已加密旅行相册（travel-dist → public，不依赖密钥）"
          else
            echo "[travel] travel-dist 缺失，跳过旅行页部署"
          fi

      # 资源自动版本化（后构建内容哈希，免手动 bump ?v）：
      # 在 hugo 构建产物 public/ 上把 src/href/url() 里的 ?v=YYYYMMDD
      # 改写为 ?v=h<内容sha256前12位>，哈希由"被引用的资源文件内容"算出。
      # 文件内容变 → 哈希必变 → 浏览器精准拉新；文件不变 → 哈希不变 → 缓存命中。
      # 只改 public/ 产物、绝不碰源码，故 guard_v_param.py（只扫源码、强制 \d{8}）继续 PASS。
      # 改写后内置自校验：凡可解析本地资源仍带日期版本、或已哈希与文件不符 → 构建失败阻断。
      - name: Hash ?v cache-bust (content-based auto versioning)
        run: python3 scripts/bump_v_hash.py public

      - name: Build Pagefind index
        run: npx pagefind --site public --verbose

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          cname: longxiong.vip
          user_name: github-actions
          user_email: actions@github.com

  # 部署后自动推送 sitemap 到搜索引擎（解决"幽灵站"不收录问题）
  # 密钥未配置时对应步骤自动跳过，不会报错；配置方法见提交说明。
  notify-search-engines:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取线上 sitemap URL 列表
        run: |
          curl -s --max-time 30 https://longxiong.vip/sitemap.xml \
            | grep -oP '(?<=<loc>)[^<]+' > urls.txt || true
          echo "待推送 URL 数量："; wc -l < urls.txt || echo 0

      - name: 推送到百度（主动推送接口）
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          token = os.environ.get("BAIDU_TOKEN", "")
          if not token:
              print("BAIDU_PUSH_TOKEN 未配置，跳过"); raise SystemExit
          urls = [l.strip() for l in open("urls.txt") if l.strip()]
          if not urls:
              print("无 URL 可推送，跳过"); raise SystemExit
          body = ("\n".join(urls)).encode("utf-8")
          api = f"http://data.zz.baidu.com/urls?site=longxiong.vip&token={token}"
          req = urllib.request.Request(api, data=body, headers={"Content-Type": "text/plain"})
          try:
              print("百度推送返回：", urllib.request.urlopen(req, timeout=20).read().decode("utf-8")[:200])
          except Exception as e:
              print("百度推送异常：", e)
          PY

      - name: 推送到 Bing IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          key = os.environ.get("INDEXNOW_KEY", "")
          if not key:
              print("INDEXNOW_KEY 未配置，跳过"); raise SystemExit
          urls = [l.strip() for l in open("urls.txt") if l.strip()]
          if not urls:
              print("无 URL 可推送，跳过"); raise SystemExit
          payload = {
              "host": "longxiong.vip",
              "key": key,
              "keyLocation": f"https://longxiong.vip/{key}.txt",
              "urlList": urls,
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              "https://www.bing.com/indexnow", data=data,
              headers={"Content-Type": "application/json"})
          try:
              print("IndexNow 返回：", urllib.request.urlopen(req, timeout=20).read().decode("utf-8")[:200])
          except Exception as e:
              print("IndexNow 异常：", e)
          PY
