name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.3'
          extended: true

      - name: Install dependencies
        run: npm install

      - name: Build Hugo
        run: hugo --gc

      - name: Build Pagefind index
        run: |
          echo "=== Before pagefind: public/ files ==="
          find public/ -type f | head -20
          echo ""
          echo "=== Running pagefind ==="
          npx pagefind --site public --verbose 2>&1
          echo ""
          echo "=== After pagefind: pagefind/ dir ==="
          ls -la public/pagefind/
          echo ""
          echo "=== pagefind fragment/ files ==="
          find public/pagefind/fragment/ -type f | head -10
          echo ""
          echo "=== pagefind index/ files ==="
          find public/pagefind/index/ -type f | head -10
          echo ""
          echo "=== Count all files in public/pagefind/ ==="
          find public/pagefind/ -type f | wc -l

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 部署后自动推送 sitemap 到搜索引擎（解决"幽灵站"不收录问题）
  # 密钥未配置时对应步骤自动跳过，不会报错；配置方法见提交说明。
  notify-search-engines:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取线上 sitemap URL 列表
        run: |
          curl -s --max-time 30 https://longxiong.vip/sitemap.xml \
            | grep -oP '(?<=<loc>)[^<]+' > urls.txt || true
          echo "待推送 URL 数量："; wc -l < urls.txt || echo 0

      - name: 推送到百度（主动推送接口）
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          token = os.environ.get("BAIDU_TOKEN", "")
          if not token:
              print("BAIDU_PUSH_TOKEN 未配置，跳过"); raise SystemExit
          urls = [l.strip() for l in open("urls.txt") if l.strip()]
          if not urls:
              print("无 URL 可推送，跳过"); raise SystemExit
          body = ("\n".join(urls)).encode("utf-8")
          api = f"http://data.zz.baidu.com/urls?site=longxiong.vip&token={token}"
          req = urllib.request.Request(api, data=body, headers={"Content-Type": "text/plain"})
          try:
              print("百度推送返回：", urllib.request.urlopen(req, timeout=20).read().decode("utf-8")[:200])
          except Exception as e:
              print("百度推送异常：", e)
          PY

      - name: 推送到 Bing IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          key = os.environ.get("INDEXNOW_KEY", "")
          if not key:
              print("INDEXNOW_KEY 未配置，跳过"); raise SystemExit
          urls = [l.strip() for l in open("urls.txt") if l.strip()]
          if not urls:
              print("无 URL 可推送，跳过"); raise SystemExit
          payload = {
              "host": "longxiong.vip",
              "key": key,
              "keyLocation": f"https://longxiong.vip/{key}.txt",
              "urlList": urls,
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              "https://www.bing.com/indexnow", data=data,
              headers={"Content-Type": "application/json"})
          try:
              print("IndexNow 返回：", urllib.request.urlopen(req, timeout=20).read().decode("utf-8")[:200])
          except Exception as e:
              print("IndexNow 异常：", e)
          PY
