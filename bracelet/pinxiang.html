<p style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;padding:0 2rem 0.5rem;color:var(--text-secondary,#8a8a8a);line-height:2;">原页面讲的是手串品相的六维评分框架——密度、油性、做工、均匀度、瑕疵、完整性，把这六项各自打分后，就能把「这条串好不好」拆成几条可对照的硬指标。这套框架本身是通用的，但它需要同时横向比较多条手串才有意义。</p>
<p style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;padding:0 2rem 2rem;color:var(--text-secondary,#8a8a8a);line-height:2;">文玩手串板块自 2026-09-22 起聚焦星月菩提一个品种，其余品种的独立专题暂停维护（后续可能重新开放），本页保留为旧链接与书签的落点。想看当前内容，请前往文玩手串板块首页。</p>
