baseURL = "https://longxiong.vip/"
defaultContentLanguage = "zh-cn"
title = "龙兄知识库"
timeout = "120s"
enableRobotsTXT = true
# 打开 GitInfo：hugo 生成页（站长手记/栏目总览/标签导航等）的「最后更新」
# 取该文件最后一次提交日，与 CI 里 sync_update_time.py 给静态页取的口径完全一致，
# 避免再出现"写死日期、永不刷新"的老问题。CI checkout 已是 fetch-depth: 0，可正常取到历史。
enableGitInfo = true

[frontmatter]
  excludeFiles = ["README.md"]

[markup]
  [markup.goldmark]
    renderer = { unsafe = true }

# 使用 uglyURLs 让生成的页面有 .html 后缀（与现有 URL 保持一致）
uglyURLs = true

[params]
  description = "AI驱动的个人知识库，涵盖AI学习、文玩手串、紫砂艺术、特斯拉动态新闻、射阳天气等实用内容。"
  keywords = "AI提示词教程,文玩科普,数码家电选购,新能源用车,居家养生科普,紫砂艺术"
  author = "龙兄"
  email = "noreply@longxiong.vip"
  baiduAnalytics = "04913e92799dc86649938ea8f5eb4b78"
  pagefind = true

# 搜索引擎站长验证（在对应平台获取验证码后填入，留空则 head.html 不输出对应 meta 标签）
[params.seo]
  googleVerify = ""   # Google Search Console -> 资源设置 -> 验证方式(HTML 标记) 的 content
  bingVerify   = ""   # Bing Webmaster Tools -> 顶部 msvalidate.01 的值
  baiduVerify  = ""   # 百度搜索资源平台 -> 站点管理 -> 验证 -> HTML 标签 的 content
  yandexVerify = ""   # Yandex Webmaster -> 验证 -> meta 标签 的 content

# Pagefind 搜索
[outputs]
  # 只输出 HTML + 站点地图。刻意关掉 Hugo 自带的 RSS：
  # 全站正式的订阅源是 scripts/build_rss.py 产出的 /rss.xml（覆盖全部 163 条内容，
  # 且带摘要与分类），而 Hugo 默认还会额外生成 /index.xml（只有 8 个内容页）、
  # /tags/index.xml、/categories/index.xml（标题被拼成「X on 龙兄知识库」的英文式样）。
  # 那三个野 feed 站内没有任何引用，属重复内容，会分散搜索引擎对订阅源的判定。
  home    = ["HTML", "SITEMAP"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term     = ["HTML"]

# 构建时压缩输出的 HTML / CSS / JS / JSON / SVG（减小传输体积、提升加载速度）
[minify]
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = false
    [minify.tdewolff.css]
      version = false
    [minify.tdewolff.js]
      keepVarNames = true  # 保守：保留变量名，避免任何脚本因压缩出错
