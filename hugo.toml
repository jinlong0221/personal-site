baseURL = "https://longxiong.vip/"
defaultContentLanguage = "zh-cn"
title = "龙兄知识库"
timeout = "120s"
enableRobotsTXT = true
enableGitInfo = false

[frontmatter]
  excludeFiles = ["README.md"]

[markup]
  [markup.goldmark]
    renderer = { unsafe = true }

# 使用 uglyURLs 让生成的页面有 .html 后缀（与现有 URL 保持一致）
uglyURLs = true

[params]
  description = "AI驱动的个人知识库，涵盖AI学习、沉香鉴别、中药材、文玩手串、中药养生茶、特斯拉动态新闻、射阳天气等实用内容。"
  keywords = "AI提示词教程,文玩科普,数码家电选购,新能源用车,居家养生科普,沉香鉴别,中药材香料"
  author = "龙兄"
  email = "799958000@qq.com"
  github = "jinlong0221/personal-site"
  baiduAnalytics = "04913e92799dc86649938ea8f5eb4b78"
  pagefind = true

# 搜索引擎站长验证（在对应平台获取验证码后填入，留空则 head.html 不输出对应 meta 标签）
[params.seo]
  googleVerify = ""   # Google Search Console -> 资源设置 -> 验证方式(HTML 标记) 的 content
  bingVerify   = ""   # Bing Webmaster Tools -> 顶部 msvalidate.01 的值
  baiduVerify  = ""   # 百度搜索资源平台 -> 站点管理 -> 验证 -> HTML 标签 的 content
  yandexVerify = ""   # Yandex Webmaster -> 验证 -> meta 标签 的 content

# Pagefind 搜索
[outputs]
  home = ["HTML", "RSS", "JSON", "SITEMAP"]  # JSON 给 Pagefind 用

# 构建时压缩输出的 HTML / CSS / JS / JSON / SVG（减小传输体积、提升加载速度）
[minify]
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = false
    [minify.tdewolff.css]
      keepCSS2 = false
    [minify.tdewolff.js]
      keepVarNames = true  # 保守：保留变量名，避免任何脚本因压缩出错
