<!-- ===== giscus 评论组件（第三方，评论存于 GitHub Discussions，纯前端、无自建代理） =====
     配置见 https://giscus.app ；repo-id 为 personal-site 仓库的 node_id。
     相比 Gitalk：纯前端直连 GitHub，无需 workers.dev 之类自建 CORS 代理，
     国内访客也可正常使用。评论存于仓库 Discussions 的 General 分类。
     该片段放在每篇文章底部。 -->
<div class="giscus-comments" aria-label="评论区"></div>
<script src="https://giscus.app/client.js"
        data-repo="jinlong0221/personal-site"
        data-repo-id="R_kgDOTA19Vw"
        data-category="General"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
</script>
