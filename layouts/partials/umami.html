<!-- ===== Umami 轻量访问统计（第三方组件，无后端、零 Cookie） =====
     使用说明：
     1. 把下方 src 的 umami.example.com 换成你的 Umami 实例地址
        （自托管示例：https://umami.your-domain.com ；云端：https://eu.umami.is 等）。
     2. 把 data-website-id 的 UMAMI_WEBSITE_ID 换成该站在 Umami 后台的 Website ID。
     3. 若 Umami 与站点不同源且用了 data-host-url，可加 data-host-url="https://umami.your-domain.com"。
     改完即生效，可在 Umami 后台实时看到访问数据。 -->
<script async src="https://umami.example.com/script.js" data-website-id="UMAMI_WEBSITE_ID"></script>
