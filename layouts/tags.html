{{ define "main" }}
{{ partial "page-header.html" . }}
<div class="page-wrap">
  <div class="detail-section">
    <h1 class="detail-title" style="text-align:center;margin:40px 0 8px;">标签聚合</h1>
    <p class="search-sub">点击任意标签，查看打上该标签的全部文章（数字为该标签文章数）</p>

  </div>
</div>
{{/* 页尾信息块：tags.html 是唯一可被索引的标签页，与全站其它内容页统一。

{{ partial "page-meta.html" . }}

{{ end }}
