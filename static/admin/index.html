<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容管理后台 · 龙兄知识库</title>
  <meta name="description" content="龙兄知识库内容管理后台：用于本地内容维护、预览与发布辅助，仅内部使用，已设置 robots noindex 不对搜索引擎开放。">
  <meta name="robots" content="noindex">
  <!-- 仅本后台页使用的宽松 CSP：放行 GitHub API 与 marked 预览 CDN；其他页面仍用全站严格 CSP -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.githubusercontent.com https://api.qrserver.com; font-src 'self' data:; connect-src 'self' https://api.github.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <style>
    :root { --bg:#15171c; --panel:#1d2027; --panel2:#23262f; --line:#333845; --txt:#e8e6e1; --mut:#9aa0ac; --gold:#d9a441; --blue:#4f8edb; --red:#e0594f; --grn:#4fae7a; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; line-height:1.6; }
    .admin-wrap { max-width:900px; margin:0 auto; padding:28px 18px 64px; }
    .admin-head h1 { font-size:1.5rem; margin:0 0 4px; }
    .admin-sub { color:var(--mut); font-size:.88rem; margin:0 0 22px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; }
    .login-tip { font-size:.84rem; color:var(--mut); margin:0 0 14px; }
    .login-tip b { color:var(--txt); }
    label { display:block; font-size:.82rem; color:var(--mut); margin:14px 0 6px; }
    input, select, textarea { width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:9px; padding:10px 12px; font-size:.92rem; font-family:inherit; }
    textarea { resize:vertical; min-height:120px; }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--gold); }
    .btn { display:inline-flex; align-items:center; gap:6px; border:none; border-radius:9px; padding:10px 16px; font-size:.9rem; cursor:pointer; font-family:inherit; }
    .btn-primary { background:var(--gold); color:#1a1206; font-weight:600; }
    .btn-primary:hover { filter:brightness(1.05); }
    .btn-ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
    .btn-ghost:hover { border-color:var(--gold); }
    .btn-danger { background:transparent; border:1px solid var(--red); color:var(--red); }
    .btn-sm { padding:6px 12px; font-size:.8rem; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .row > * { flex:0 0 auto; }
    .grow { flex:1 1 auto; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:8px 0 18px; flex-wrap:wrap; }
    .group { margin:18px 0; }
    .group-h { font-size:1.05rem; font-weight:600; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
    .group-n { font-size:.74rem; color:var(--mut); font-weight:400; }
    .item { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line); }
    .item-title { font-size:.95rem; }
    .item-meta { font-size:.76rem; color:var(--mut); margin-top:2px; }
    .item-actions { display:flex; gap:8px; flex:0 0 auto; }
    .empty { color:var(--mut); font-size:.9rem; padding:10px 0; }
    .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-start; justify-content:center; padding:30px 14px; overflow:auto; z-index:50; }
    .modal { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; width:100%; max-width:680px; }
    .modal h2 { margin:0 0 14px; font-size:1.2rem; }
    .preview { background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:12px 14px; font-size:.9rem; min-height:60px; overflow:auto; max-height:260px; }
    .preview h1,.preview h2,.preview h3 { margin:.4em 0; }
    .preview code { background:rgba(255,255,255,.08); padding:1px 5px; border-radius:4px; }
    .preview a { color:var(--blue); }
    .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); color:var(--txt); padding:11px 18px; border-radius:10px; font-size:.88rem; opacity:0; transition:opacity .25s; pointer-events:none; z-index:80; max-width:90vw; }
    .toast.show { opacity:1; }
    .toast.err { border-color:var(--red); color:#ffd9d5; }
    .toast.ok { border-color:var(--grn); }
    .err-box { color:var(--red); font-size:.85rem; margin-top:10px; }
    .hidden { display:none !important; }
    a.link { color:var(--blue); text-decoration:none; }
    a.link:hover { text-decoration:underline; }
    .hint { font-size:.76rem; color:var(--mut); margin-top:4px; }
  </style>
</head>
<body>
  <div class="admin-wrap" id="app">
    <header class="admin-head">
      <h1>内容管理后台</h1>
      <p class="admin-sub">龙兄知识库 · 原创内容自助发布（直连 GitHub，无需中间服务）</p>
    </header>
    <div id="login" class="card hidden"></div>
    <div id="panel" class="hidden"></div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/js/admin.js"></script>
</body>
</html>
